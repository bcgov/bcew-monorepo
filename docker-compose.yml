services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    container_name: playwright
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - .pnpm-store:/pnpm-store
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NODE_ENV: test
      WP_ENVIRONMENT: local
      WP_E2E_SKIP_ENV_SETUP: "true"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/playwright-ready"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 2s

    command: >
      sh -c "
        npm i -g pnpm
        pnpm install --frozen-lockfile --yes
        touch /tmp/playwright-ready
        tail -f /dev/null
      "

volumes:
  node_modules:
