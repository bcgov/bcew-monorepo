name: Pull request SonarQube scan

on:
    workflow_call:
        inputs:
            has-coverage:
                description: Whether PHP coverage files are available
                required: true
                type: string
        secrets:
            SONAR_TOKEN:
                required: true

permissions:
    contents: read

jobs:
    sonarqube:
        name: SonarQube
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            # Extract php-coverage directly into sonar-artifacts/ so paths match
            # sonar.php.coverage.reportPaths (sonar-artifacts/plugins/*/coverage.xml).
            - uses: actions/download-artifact@v8.0.1
              if: inputs.has-coverage == 'true'
              with:
                name: php-coverage
                path: sonar-artifacts

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f #v8.2.1
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}