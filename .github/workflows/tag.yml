# Release a WordPress plugin or theme from this monorepo.
#
# Run this workflow by hand (Actions → Tag WordPress Plugin or Theme). Pick
# the project and tick Alpha when the release should be an alpha. The version
# is not typed in: a script reads existing {project}/v* tags and applies the
# house rules (alphas count up on the same X.Y.Z; a real release is that
# X.Y.Z if it is missing; after a real release the next series is the next
# minor). Nx Release then stamps files, commits, tags, creates the GitHub
# Release, zips the project, and updates packages.json for Composer.
#
# Do not pass --specifier= or --git-commit to nx release. The version is a
# positional argument. Commit, tag, and push come from nx.json.

name: Release Subproject and Update packages.json
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Project to release'
        required: true
        type: choice
        options:
          - bcew-blocks
          - bcew-belleville-terminal
          - bcew-theme-2
          - bcew-ticorp
          - bcew-document-repository
          - bcew-chefs-embed
          - bcew-theme
          - bcew-plugin
      alpha:
        description: 'Alpha'
        type: boolean
        default: false

# Share the lock with tag-delete.yml so packages.json is not written by two jobs at once.
concurrency:
  group: composer-repo-update
  cancel-in-progress: false

jobs:
  build-and-deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      # App token can push tags and commit on protected branches. GITHUB_TOKEN cannot.
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # fetch-depth: 0 is required so next-release-version-cli.mjs sees every {project}/v* tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
          cache: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # Nx commits as this identity. Matches the usual github-actions bot.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Nx Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PACKAGES_JSON_URL: https://${{ github.repository_owner }}.github.io/bcew-monorepo/packages.json
          NAME: ${{ inputs.name }}
          ALPHA: ${{ inputs.alpha }}
        run: |
          set -euo pipefail
          VERSION="$(node .github/scripts/next-release-version-cli.mjs "${NAME}" "${ALPHA}")"
          # specifier is positional: `nx release 1.1.0-alpha.1`, not --specifier=.
          ARGS=(release "${VERSION}" --projects="${NAME}" --yes)
          # No tags yet: tell Nx to use package.json as the current version.
          if ! git tag --list "${NAME}/v*" | grep -q .; then
            ARGS+=(--first-release)
          fi
          echo "npx nx ${ARGS[*]}"
          npx nx "${ARGS[@]}"

      # publish-wordpress-release.sh writes public/packages.json. Skip deploy when that file was not created.
      - name: Deploy packages.json to GH Pages
        if: ${{ hashFiles('public/packages.json') != '' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          publish_dir: ./public
          keep_files: true
