name: Release Subproject and Update packages.json
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Project to release'
        required: true
        type: choice
        options:
          - bcew-blocks
          - bcew-belleville-terminal
          - bcew-theme-2
          - bcew-ticorp
          - bcew-document-repository
          - bcew-chefs-embed
          - bcew-theme
          - bcew-plugin
      kind:
        description: 'What kind of release?'
        required: true
        type: choice
        options:
          - Real release
          - Alpha
          - Beta
          - RC
          - Custom version
      custom_version:
        description: 'Only if you chose Custom version. Example: 1.2.3-alpha.1. Leave blank otherwise.'
        required: false
        type: string
        default: ''
      first_release:
        description: 'First release for this project (no matching git tag yet)'
        type: boolean
        default: false

concurrency:
  group: composer-repo-update
  cancel-in-progress: false

jobs:
  build-and-deploy:
    permissions:
       contents: write
       pages: write
       id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
            client-id: ${{ vars.GH_APP_CLIENT_ID }}
            private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
            version: 10
            cache: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v6.4.0
        with:
            node-version: 24
            cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Nx Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PACKAGES_JSON_URL: https://${{ github.repository_owner }}.github.io/bcew-monorepo/packages.json
          NAME: ${{ inputs.name }}
          KIND: ${{ inputs.kind }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          FIRST_RELEASE: ${{ inputs.first_release }}
        run: |
          set -euo pipefail
          ARGS=(release --projects="${NAME}" --yes --git-commit --git-tag --git-push)

          case "${KIND}" in
            "Real release")
              if [[ -n "${CUSTOM_VERSION}" ]]; then
                echo "You picked Real release. Leave Custom version blank, or pick Custom version."
                exit 1
              fi
              ;;
            Alpha)
              ARGS+=(--specifier=prerelease --preid=alpha)
              ;;
            Beta)
              ARGS+=(--specifier=prerelease --preid=beta)
              ;;
            RC)
              ARGS+=(--specifier=prerelease --preid=rc)
              ;;
            "Custom version")
              if [[ -z "${CUSTOM_VERSION}" ]]; then
                echo "You picked Custom version. Fill in Custom version (for example 1.2.3-alpha.1)."
                exit 1
              fi
              ARGS+=(--specifier="${CUSTOM_VERSION}")
              ;;
            *)
              echo "Unknown kind: ${KIND}"
              exit 1
              ;;
          esac

          if [[ "${FIRST_RELEASE}" == "true" ]]; then
            ARGS+=(--first-release)
          fi
          echo "npx nx ${ARGS[*]}"
          npx nx "${ARGS[@]}"

      - name: Deploy packages.json to GH Pages
        if: ${{ hashFiles('public/packages.json') != '' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          publish_dir: ./public
          keep_files: true
