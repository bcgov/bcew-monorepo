name: Pull request integration tests

on:
    workflow_call:
        outputs:
            has-coverage:
                description: Whether PHP coverage files were generated
                value: ${{ jobs.test-integration.outputs.has-coverage }}

permissions:
    contents: read

env:
    NX_DEFAULT_OUTPUT_STYLE: static

jobs:
    test-integration:
        name: Test integration
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            has-coverage: ${{ steps.coverage.outputs.has-coverage }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - uses: ./.github/actions/setup
              with:
                  install-composer: 'true'

            # wp-env pulls these from Docker Hub. Anonymous pulls from
            # GitHub-hosted runners time out once every project starts at once.
            # Tag the mirror copies with the names wp-env already uses.
            - name: Load WordPress images from the Docker Hub mirror
              run: |
                  set -euo pipefail
                  pull() {
                    local image="$1"
                    docker pull "mirror.gcr.io/library/${image}"
                    docker tag "mirror.gcr.io/library/${image}" "${image}"
                  }
                  pull mariadb:lts
                  pull wordpress:php7.4
                  pull wordpress:cli-php7.4

            - name: Run affected PHP integration tests
              if: github.event_name == 'pull_request'
              run: pnpm nx affected --base="origin/${{ github.base_ref }}" -t test-integration

            - name: Run PHP integration tests
              if: github.event_name == 'push'
              run: pnpm nx run-many -t test-integration

            # PHPUnit runs in wp-env, so clover paths use /var/www/html/wp-content/...
            # Rewrite them to repo-relative paths Sonar can match.
            - name: Normalize coverage paths
              run: |
                shopt -s nullglob
                for f in plugins/*/coverage.xml themes/*/coverage.xml; do
                  sed -i 's#/var/www/html/wp-content/##g' "$f"
                done

            - name: Check for coverage files
              id: coverage
              run: |
                if find plugins themes -type f -name coverage.xml | grep -q .; then
                  echo "has-coverage=true" >> "$GITHUB_OUTPUT"
                else
                  echo "has-coverage=false" >> "$GITHUB_OUTPUT"
                fi

            - name: Upload coverage
              if: steps.coverage.outputs.has-coverage == 'true'
              uses: actions/upload-artifact@v7.0.1
              with:
                name: php-coverage
                path: |
                  plugins/*/coverage.xml
                  themes/*/coverage.xml
                if-no-files-found: warn