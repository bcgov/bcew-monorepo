name: Pull request checks

on:
    pull_request:
    push:
        branches:
            - main

# Avoid duplicate runs on force-pushes
concurrency:
    group: pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NX_DEFAULT_OUTPUT_STYLE: static

jobs:
    labeler:
        name: Add labels
        permissions:
            contents: read
            pull-requests: write
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/labeler@v6
              with:
                  sync-labels: true

    lint:
        name: Lint monorepo
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Install Composer dependencies
              run: composer i

            - name: Run php lint
              run: pnpm run lint-php

            - name: Run js lint
              run: pnpm run lint-js

            - name: Run css lint
              run: pnpm run lint-css

            - name: Run md lint
              run: pnpm run lint-md

            - name: Run package.json lint
              run: pnpm run lint-pkg-json

            - name: Run template parts lint
              run: pnpm run lint-template-parts
    
    test-integration:
        name: Test integration
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Install Composer dependencies
              run: composer i

            # wp-env pulls these from Docker Hub. Anonymous pulls from
            # GitHub-hosted runners time out once every project starts at once.
            # Tag the mirror copies with the names wp-env already uses.
            - name: Load WordPress images from the Docker Hub mirror
              run: |
                  set -euo pipefail
                  pull() {
                    local image="$1"
                    docker pull "mirror.gcr.io/library/${image}"
                    docker tag "mirror.gcr.io/library/${image}" "${image}"
                  }
                  pull mariadb:lts
                  pull wordpress:php7.4
                  pull wordpress:cli-php7.4

            - name: Run affected PHP integration tests
              if: github.event_name == 'pull_request'
              run: pnpm nx affected --base="origin/${{ github.base_ref }}" -t test-integration

            - name: Run PHP integration tests
              if: github.event_name == 'push'
              run: pnpm nx run-many -t test-integration

            # PHPUnit runs in wp-env, so clover paths use /var/www/html/wp-content/...
            # Rewrite them to repo-relative paths Sonar can match.
            - name: Normalize coverage paths
              run: |
                shopt -s nullglob
                for f in plugins/*/coverage.xml themes/*/coverage.xml; do
                  sed -i 's#/var/www/html/wp-content/##g' "$f"
                done

            - name: Upload coverage
              uses: actions/upload-artifact@v7.0.1
              with:
                name: php-coverage
                path: |
                  plugins/*/coverage.xml
                  themes/*/coverage.xml
                if-no-files-found: warn

    test-unit-js:
        name: Test unit (JS, affected)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Run affected JS unit tests
              if: github.event_name == 'pull_request'
              run: pnpm nx affected --base="origin/${{ github.base_ref }}" -t test-unit-js

            - name: Run JS unit tests
              if: github.event_name == 'push'
              run: pnpm nx run-many -t test-unit-js

    affected-test-projects:
        name: Find affected e2e and screenshot projects
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: github.event_name == 'pull_request'
        outputs:
            projects: ${{ steps.affected.outputs.projects }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: List affected e2e and screenshot projects
              id: affected
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  projects=$(pnpm --silent nx show projects --affected --base="origin/$BASE_REF" --withTarget=test-e2e-docker --withTarget=test-screenshot --json)
                  echo "projects=$projects" >> "$GITHUB_OUTPUT"
                  echo "Affected e2e and screenshot projects: $projects"

    test-playwright-project:
        name: Test e2e and screenshots (${{ matrix.project }})
        needs: affected-test-projects
        if: needs.affected-test-projects.outputs.projects != '[]'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                project: ${{ fromJSON(needs.affected-test-projects.outputs.projects) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Install Composer dependencies
              run: composer i

            # Same images as the integration job. Load them before wp-env starts.
            - name: Load WordPress images from the Docker Hub mirror
              run: |
                  set -euo pipefail
                  pull() {
                    local image="$1"
                    docker pull "mirror.gcr.io/library/${image}"
                    docker tag "mirror.gcr.io/library/${image}" "${image}"
                  }
                  pull mariadb:lts
                  pull wordpress:php7.4
                  pull wordpress:cli-php7.4

            - name: Start playwright container
              run: docker compose up -d --wait playwright || { docker logs playwright; exit 1; }

            # run-many skips targets a project lacks; --parallel=1 avoids concurrent use of the shared wp-env and Playwright container.
            - name: Run e2e and screenshot tests
              run: npx nx run-many -t test-e2e-docker test-screenshot --projects="${{ matrix.project }}" --parallel=1 --playwrightArgs="--max-failures=1 --reporter=list,github" --no-tui

            - name: Summarize screenshot failures
              if: failure()
              env:
                  PROJECT: ${{ matrix.project }}
              run: |
                  {
                    echo "### Playwright failures: $PROJECT"
                    echo
                    echo "Download the \`playwright-report-$PROJECT\` artifact for actual, expected, and diff images plus traces."
                    echo
                    find plugins themes -path '*/artifacts/test-results/*' -name '*-diff.png' -print 2>/dev/null
                    find plugins themes -path '*/artifacts/test-results/*' -name 'error-context.md' 2>/dev/null | while read -r file; do
                      echo
                      echo "<details><summary>$file</summary>"
                      echo
                      head -n 60 "$file"
                      echo
                      echo "</details>"
                    done
                  } >> "$GITHUB_STEP_SUMMARY"

            - uses: actions/upload-artifact@v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report-${{ matrix.project }}
                  path: |
                    plugins/*/artifacts/test-results/
                    themes/*/artifacts/test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    check-playwright-results:
        name: Check e2e and screenshot results (affected)
        needs:
            - affected-test-projects
            - test-playwright-project
        if: ${{ always() && github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Validate project discovery and test results
              env:
                  PROJECT_DISCOVERY_RESULT: ${{ needs.affected-test-projects.result }}
                  TEST_MATRIX_RESULT: ${{ needs.test-playwright-project.result }}
              run: |
                  echo "Project discovery: $PROJECT_DISCOVERY_RESULT; test matrix: $TEST_MATRIX_RESULT"
                  [[ "$PROJECT_DISCOVERY_RESULT" == success && "$TEST_MATRIX_RESULT" =~ ^(success|skipped)$ ]]

    sonarqube:
      name: SonarQube
      needs:
        - test-integration
        # later:
        # - test-js
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0

        # Extract php-coverage directly into sonar-artifacts/ so paths match
        # sonar.php.coverage.reportPaths (sonar-artifacts/plugins/*/coverage.xml).
        - uses: actions/download-artifact@v8.0.1
          with:
            name: php-coverage
            path: sonar-artifacts

        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f #v8.2.1
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
