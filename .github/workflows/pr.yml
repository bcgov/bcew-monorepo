name: Pull request checks

on:
    pull_request:
    push:
        branches:
            - main

# Avoid duplicate runs on force-pushes
concurrency:
    group: pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Quality
        uses: ./.github/workflows/pr-quality.yml
        permissions:
            contents: read
            pull-requests: write

    test-integration:
        name: Test integration
        uses: ./.github/workflows/pr-integration.yml

    test-unit-js:
        name: Test unit (JS, affected)
        uses: ./.github/workflows/pr-unit.yml

    test-playwright:
        name: Test e2e and screenshots
        uses: ./.github/workflows/pr-playwright.yml

    sonarqube:
        name: SonarQube
        needs:
            - test-integration
        uses: ./.github/workflows/pr-sonarqube.yml
        with:
            has-coverage: ${{ needs.test-integration.outputs.has-coverage }}
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}