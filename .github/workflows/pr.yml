name: Pull request checks

on:
    pull_request:
    push:
        branches:
            - main

# Avoid duplicate runs on force-pushes
concurrency:
    group: pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NX_DEFAULT_OUTPUT_STYLE: static

jobs:
    labeler:
        name: Add labels
        permissions:
            contents: read
            pull-requests: write
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/labeler@v6
              with:
                  sync-labels: true

    lint:
        name: Lint monorepo
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Install Composer dependencies
              run: composer i

            - name: Run php lint
              run: pnpm run lint-php

            - name: Run js lint
              run: pnpm run lint-js

            - name: Run css lint
              run: pnpm run lint-css

            - name: Run md lint
              run: pnpm run lint-md

            - name: Run package.json lint
              run: pnpm run lint-pkg-json

            - name: Run template parts lint
              run: pnpm run lint-template-parts
    
    test-integration:
        name: Test integration
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Install Composer dependencies
              run: composer i

            - name: Run affected PHP integration tests
              if: github.event_name == 'pull_request'
              run: pnpm nx affected --base="origin/${{ github.base_ref }}" -t test-integration

            - name: Run PHP integration tests
              if: github.event_name == 'push'
              run: pnpm nx run-many -t test-integration

            # PHPUnit runs in wp-env, so clover paths use /var/www/html/wp-content/...
            # Rewrite them to repo-relative paths Sonar can match.
            - name: Normalize coverage paths
              run: |
                shopt -s nullglob
                for f in plugins/*/coverage.xml themes/*/coverage.xml; do
                  sed -i 's#/var/www/html/wp-content/##g' "$f"
                done

            - name: Upload coverage
              uses: actions/upload-artifact@v7.0.1
              with:
                name: php-coverage
                path: |
                  plugins/*/coverage.xml
                  themes/*/coverage.xml
                if-no-files-found: warn

    test-unit-js:
        name: Test unit (JS, affected)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Run affected JS unit tests
              if: github.event_name == 'pull_request'
              run: pnpm nx affected --base="origin/${{ github.base_ref }}" -t test-unit-js

            - name: Run JS unit tests
              if: github.event_name == 'push'
              run: pnpm nx run-many -t test-unit-js

    test-e2e:
        name: Test e2e (affected)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Start playwright container
              run: docker compose up -d playwright

            # --nxBail stops queued projects after the first failure; in-flight ones still finish.
            # --max-failures=1 stops each project's Playwright run at its first failing test.
            - name: Run e2e tests
              run: npx nx affected --base="origin/${{ github.base_ref }}" -t test-e2e-docker --nxBail --playwrightArgs=--max-failures=1

            - uses: actions/upload-artifact@v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: playwright-e2e-report
                  path: |
                    plugins/*/artifacts/test-results/
                    themes/*/artifacts/test-results/
                  retention-days: 7

    screenshot-projects:
        name: Find screenshot projects (affected)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: github.event_name == 'pull_request'
        outputs:
            projects: ${{ steps.affected.outputs.projects }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: List affected screenshot projects
              id: affected
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  projects=$(pnpm --silent nx show projects --affected --base="origin/$BASE_REF" --withTarget=test-screenshot --json)
                  echo "projects=$projects" >> "$GITHUB_OUTPUT"
                  echo "Affected screenshot projects: $projects"

    test-screenshot-project:
        name: Test screenshots (${{ matrix.project }})
        needs: screenshot-projects
        if: needs.screenshot-projects.outputs.projects != '[]'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                project: ${{ fromJSON(needs.screenshot-projects.outputs.projects) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Cache pnpm store
              uses: actions/cache@v6.1.0
              with:
                  path: .pnpm-store
                  key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-store-

            - name: Install Composer dependencies and start playwright container
              run: |
                  docker compose up -d playwright
                  composer i
                  until [ "$(docker inspect --format='{{.State.Health.Status}}' playwright)" = healthy ]; do
                    health_status=$(docker inspect --format='{{.State.Health.Status}}' playwright)
                    if [ "$health_status" = unhealthy ]; then
                      docker logs playwright
                      exit 1
                    fi
                    sleep 2
                  done

            - name: Run screenshot tests
              run: npx nx run "${{ matrix.project }}:test-screenshot" --playwrightArgs="--max-failures=1 --reporter=list,github" --no-tui

            - name: Summarize screenshot failures
              if: failure()
              env:
                  PROJECT: ${{ matrix.project }}
              run: |
                  {
                    echo "### Screenshot failures: $PROJECT"
                    echo
                    echo "Download the \`playwright-screenshot-report-$PROJECT\` artifact for actual, expected, and diff images plus traces."
                    echo
                    find plugins themes -path '*/artifacts/test-results/*' -name '*-diff.png' -print 2>/dev/null
                    find plugins themes -path '*/artifacts/test-results/*' -name 'error-context.md' 2>/dev/null | while read -r file; do
                      echo
                      echo "<details><summary>$file</summary>"
                      echo
                      head -n 60 "$file"
                      echo
                      echo "</details>"
                    done
                  } >> "$GITHUB_STEP_SUMMARY"

            - uses: actions/upload-artifact@v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: playwright-screenshot-report-${{ matrix.project }}
                  path: |
                    plugins/*/artifacts/test-results/
                    themes/*/artifacts/test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    test-screenshot:
        name: Test screenshots (affected)
        needs:
            - screenshot-projects
            - test-screenshot-project
        if: ${{ always() && github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check screenshot results
              env:
                  FIND_RESULT: ${{ needs.screenshot-projects.result }}
                  TEST_RESULT: ${{ needs.test-screenshot-project.result }}
              run: |
                  echo "Find projects: $FIND_RESULT; screenshot tests: $TEST_RESULT"
                  [[ "$FIND_RESULT" == success && "$TEST_RESULT" =~ ^(success|skipped)$ ]]

    sonarqube:
      name: SonarQube
      needs:
        - test-integration
        # later:
        # - test-js
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0

        # Extract php-coverage directly into sonar-artifacts/ so paths match
        # sonar.php.coverage.reportPaths (sonar-artifacts/plugins/*/coverage.xml).
        - uses: actions/download-artifact@v8.0.1
          with:
            name: php-coverage
            path: sonar-artifacts

        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f #v8.2.1
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
