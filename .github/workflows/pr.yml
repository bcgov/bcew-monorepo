name: Pull request checks

on:
    pull_request:
    push:
        branches:
            - main

# Avoid duplicate runs on force-pushes
concurrency:
    group: pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    labeler:
        name: Add labels
        permissions:
            contents: read
            pull-requests: write
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/labeler@v6
              with:
                  sync-labels: true

    lint:
        name: Lint monorepo
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Install Composer dependencies
              run: composer i

            - name: Run php lint
              run: pnpm run lint-php

            - name: Run js lint
              run: pnpm run lint-js

            - name: Run css lint
              run: pnpm run lint-css

            - name: Run md lint
              run: pnpm run lint-md

            - name: Run package.json lint
              run: pnpm run lint-pkg-json
    
    test-integration:
        name: Test integration
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Install Composer dependencies
              run: composer i

            - name: Run affected PHP integration tests
              if: github.event_name == 'pull_request'
              run: pnpm nx affected -t test-integration --coverage-clover=coverage.xml

            - name: Run PHP integration tests
              if: github.event_name == 'push'
              run: pnpm nx run-many -t test-integration --coverage-clover=coverage.xml

            - name: Upload coverage
              uses: actions/upload-artifact@v7.0.1
              with:
                name: php-coverage
                path: |
                  plugins/*/coverage.xml
                  themes/*/coverage.xml

    test-e2e:
        name: Test e2e (affected)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Install Composer dependencies
              run: composer i

            - name: Cache pnpm store
              uses: actions/cache@v6.1.0
              with:
                  path: .pnpm-store
                  key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-store-

            - name: Start playwright container
              run: docker compose up -d playwright

            - name: Run e2e tests
              run: npx nx affected --base="origin/${{ github.base_ref }}" -t test-e2e-docker

            - uses: actions/upload-artifact@v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: playwright-e2e-report
                  path: |
                    plugins/*/artifacts/test-results/
                    themes/*/artifacts/test-results/
                  retention-days: 7

    test-screenshot:
        name: Test screenshots (affected)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Setup Node.js 24
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@v6.0.9
              with:
                  version: 10
                  run_install: true
                  cache: true

            - name: Install Composer dependencies
              run: composer i

            - name: Cache pnpm store
              uses: actions/cache@v6.1.0
              with:
                  path: .pnpm-store
                  key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-store-

            - name: Start playwright container
              run: docker compose up -d playwright

            - name: Run screenshot tests
              run: npx nx affected --base="origin/${{ github.base_ref }}" -t test-screenshot

            - uses: actions/upload-artifact@v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: playwright-screenshot-report
                  path: |
                    plugins/*/artifacts/test-results/
                    themes/*/artifacts/test-results/
                  retention-days: 7

    sonarqube:
      name: SonarQube
      needs:
        - test-integration
        # later:
        # - test-js
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0

        - uses: actions/download-artifact@v8.0.1
          with:
            path: sonar-artifacts


        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f #v8.2.1
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
