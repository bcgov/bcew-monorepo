name: Delete branch from standalone repositories

on:
    delete:

concurrency:
    group: delete-branch-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    list-projects:
        name: List all sub-projects
        runs-on: ubuntu-latest
        outputs:
            projects: ${{ steps.compute.outputs.projects }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: List projects
              id: compute
              shell: bash
              run: echo "projects=$(npx nx show projects --json)" >> "$GITHUB_OUTPUT"

    delete-branch:
        name: Delete branch from ${{ matrix.project }}
        needs: list-projects
        if: ${{ needs.list-projects.outputs.projects != '' && needs.list-projects.outputs.projects != '[]' }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                project: ${{ fromJSON(needs.list-projects.outputs.projects) }}
        permissions:
            contents: write
        steps:
            - name: Delete branch from target repo
              run: |
                  git remote add target https://github.com/bcgov/${{ matrix.project }}
                  git branch -D ${{ github.head_ref || github.ref_name }} 


